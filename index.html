for(let i=0;i<9;i++){const d=document.createElement("div");d.className="deco";d.textContent=ORD[(i*7+3)%28];d.style.cssText="top:"+[2,12,30,48,62,78,90,20,70][i]+"%;"+(i%2?"left":"right")+":"+[-40,-60,-30,-50,-20,-60,-40,-90,-80][i]+"px;transform:rotate("+(i*17%40-20)+"deg)";$("setup").prepend(d);}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{cfg[c.dataset.k]=+c.dataset.v;document.querySelectorAll('.chip[data-k="'+c.dataset.k+'"]').forEach(x=>x.classList.toggle("on",x===c));});
function chk(){$("go").disabled=!($("gn").value.trim()&&$("to").value.trim()&&$("tg").value.trim());}
["gn","to","tg"].forEach(i=>$(i).oninput=chk);
$("go").onclick=()=>{try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock("landscape");}).catch(()=>{});}catch(e){}nm[2]=$("to").value.trim();nm[1]=$("tg").value.trim();$("gn2").textContent=$("gn").value.trim();$("no").textContent=nm[2];$("ng").textContent=nm[1];$("a2").textContent="🟥 "+nm[2];$("a1").textContent="🟦 "+nm[1];wins=[0,0];rd=1;fin=false;$("setup").style.display="none";$("game").style.display="flex";startRound();};
function startRound(){
 pz=false;$("pz").style.display="none";$("pause").textContent="⏸";
 const n=cfg.n;L=n==5?ORD.slice(0,25):ORD.slice().sort(()=>Math.random()-.5).slice(0,n*n).sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
 st=L.map(()=>0);cur=-1;over=false;
 const b=$("brd");b.innerHTML="";
 for(let r=0;r<n;r++){const w=document.createElement("div");w.className="rw";
  for(let c=0;c<n;c++){const i=r*n+c;const h=document.createElement("button");h.className="hx";h.id="h"+i;h.innerHTML="<i>"+L[i]+"</i>";h.onclick=()=>pick(i);w.appendChild(h);}
  b.appendChild(w);}
 $("rt").textContent="الجولة "+["الأولى","الثانية","الثالثة"][rd-1];
 $("qc").style.display="none";$("asg").style.display="none";$("msg").textContent="";$("ok").disabled=true;$("nx").disabled=true;$("nx").textContent="الجولة التالية";$("menu").style.display="none";
 sc();fit();
}
function fit(){const a=$("ba"),n=cfg.n;if(!a.clientWidth)return;const w=Math.min(a.clientWidth/(n+.5),a.clientHeight/(.866*n+.29))*.95;document.documentElement.style.setProperty("--w",w+"px");}
let _f;const sched=()=>{cancelAnimationFrame(_f);_f=requestAnimationFrame(fit)};window.onresize=sched;try{new ResizeObserver(sched).observe($("ba"))}catch(e){}window.addEventListener("orientationchange",()=>setTimeout(sched,250));if(window.visualViewport)visualViewport.addEventListener("resize",sched);
function sc(){$("so").textContent=wins[1];$("sg").textContent=wins[0];}
function pick(i,f){
 if(i===cur&&!f)return;if(st[i]||over||pz)return;
 if(cur>=0)$("h"+cur).classList.remove("sel");
 cur=i;$("h"+i).classList.add("sel");
 const pool=BANK[L[i]]||[];let fr=pool.filter(x=>!used.has(x[0]));if(!fr.length){pool.forEach(x=>used.delete(x[0]));fr=pool;}
 if(!fr.length){$("msg").textContent="تعذر تحميل أسئلة هذا الحرف";cur=-1;return;}
 curQ=fr[Math.random()*fr.length|0];used.add(curQ[0]);
 saveUsed();
 $("ql").textContent=L[i];$("lv").textContent="الصعوبة: "+curQ[2];$("qt").textContent=curQ[0];$("an").textContent="";
 $("qc").style.display="block";$("sa").style.display="";$("asg").style.display="none";$("ok").disabled=false;
}
$("sa").onclick=()=>{if(pz||cur<0||!curQ)return;$("an").textContent=curQ[1];$("sa").style.display="none";};
$("ok").onclick=()=>{if(pz||cur<0||!curQ)return;$("asg").style.display="flex";$("ok").disabled=true;};
$("rr").onclick=()=>{if(cur>=0)pick(cur,1);};
document.querySelectorAll("#asg button").forEach(b=>b.onclick=()=>{
 if(pz||cur<0||over)return;
 const t=+b.dataset.t,h=$("h"+cur);h.classList.remove("sel");
 if(t){st[cur]=t;h.classList.add(t==2?"o":"g");}
 cur=-1;$("qc").style.display="none";$("asg").style.display="none";$("ok").disabled=true;
 if(t&&won(t)){over=true;wins[t-1]++;sc();const m=wins[t-1]>=Math.floor(cfg.r/2)+1;
  $("msg").textContent=m?"🏆 فاز "+nm[t]+" باللعبة!":"🎉 فاز "+nm[t]+" بالجولة!";
  if(m){fin=true;$("nx").textContent="لعبة جديدة";}$("nx").disabled=false;}
});
$("nx").onclick=()=>{if(fin){$("game").style.display="none";$("setup").style.display="block";}else{rd++;startRound();}};
$("pause").onclick=()=>{pz=!pz;$("pz").style.display=pz?"flex":"none";$("pause").textContent=pz?"▶":"⏸";};
$("opt").onclick=()=>{const m=$("menu");m.style.display=m.style.display=="flex"?"none":"flex";};
$("m1").onclick=()=>{startRound();};
$("m2").onclick=()=>{$("game").style.display="none";$("setup").style.display="block";};
function nb(r,c){const n=cfg.n,o=[[r,c-1],[r,c+1]];
 if(r%2==0)o.push([r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]);else o.push([r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]);
 return o.filter(([a,b])=>a>=0&&a<n&&b>=0&&b<n);}
function won(p){const n=cfg.n,seen=new Set(),q=[];
 for(let k=0;k<n;k++){const [r,c]=p==2?[0,k]:[k,0];if(st[r*n+c]==p){q.push([r,c]);seen.add(r*n+c);}}
 while(q.length){const [r,c]=q.pop();if(p==2&&r==n-1)return true;if(p==1&&c==n-1)return true;
  for(const [a,b] of nb(r,c)){const i=a*n+b;if(st[i]==p&&!seen.has(i)){seen.add(i);q.push([a,b]);}}}
 return false;}
</script>

document.querySelectorAll("button").forEach(b=>b.type="button");
